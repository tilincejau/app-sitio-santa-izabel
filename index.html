<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16342a">
  <title>Sítio Santa Izabel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- MENU -->
  <section id="tela-menu" class="tela">
    <header class="topo">
      <div>
        <strong>Sítio Santa Izabel</strong>
        <span class="sub">Registros da lavoura</span>
      </div>
    </header>
    <button id="status-sync" class="pill" type="button"></button>
    <main id="grid-modulos" class="menu"></main>
  </section>

  <!-- FORMULÁRIO -->
  <section id="tela-form" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><i class="ph ph-arrow-left"></i></button>
      <strong id="form-titulo"></strong>
    </header>
    <div id="form-ultimos" class="ultimos" hidden></div>
    <main id="form-root" class="form"></main>
  </section>

  <!-- ESTOQUE -->
  <section id="tela-estoque" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><i class="ph ph-arrow-left"></i></button>
      <strong>Estoque de produtos</strong>
    </header>
    <nav class="abas" id="estoque-abas"></nav>
    <main id="estoque-root" class="form"></main>
  </section>

  <!-- PENDÊNCIAS -->
  <section id="tela-pendencias" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><i class="ph ph-arrow-left"></i></button>
      <strong>Envios</strong>
    </header>
    <main id="pendencias-root" class="form"></main>
  </section>

  <script src="script.js"></script>
</body>
</html>
