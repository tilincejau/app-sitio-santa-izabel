<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0e4a26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Santa Izabel">
  <title>Sítio Santa Izabel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ACESSO -->
  <section id="tela-acesso" class="tela" hidden>
    <header class="marca"><img src="logo.png" alt="Sítio Santa Izabel"></header>
    <main class="form">
      <h2 style="margin:18px 0 4px">Código de acesso</h2>
      <p class="sub" style="margin:0 0 12px">Digite o código que você recebeu. Ele fica guardado neste aparelho, e você só precisa digitar uma vez.</p>
      <div class="campo">
        <input id="campo-codigo" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12" style="text-transform: uppercase; letter-spacing: 2px; font-size: 20px; text-align: center">
      </div>
      <p id="acesso-msg" class="erro-msg" hidden></p>
      <button id="btn-acesso" class="btn" type="button">Entrar</button>
    </main>
  </section>

  <!-- MENU -->
  <section id="tela-menu" class="tela" hidden>
    <header class="marca"><img src="logo.png" alt="Sítio Santa Izabel"></header>
    <button id="status-sync" class="painel" type="button"></button>
    <button id="alerta-chegadas" class="alerta-rec prio-3" type="button" hidden></button>
    <button id="alerta-diesel" class="alerta-rec prio-2" type="button" hidden></button>
    <button id="alerta-hidrometro" class="alerta-rec prio-1" type="button" hidden></button>
    <button id="alerta-lavagem" class="alerta-rec prio-0" type="button" hidden></button>
    <button id="alerta-receitas" class="alerta-rec" type="button" hidden></button>
    <main id="grid-modulos" class="menu-secoes"></main>
  </section>

  <!-- FORMULÁRIO -->
  <section id="tela-form" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <strong id="form-titulo"></strong>
    </header>
    <div id="form-ultimos" class="ultimos" hidden></div>
    <main id="form-root" class="form"></main>
  </section>

  <!-- ESTOQUE -->
  <section id="tela-estoque" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <strong>Estoque de produtos</strong>
    </header>
    <nav class="abas" id="estoque-abas"></nav>
    <main id="estoque-root" class="form"></main>
  </section>

  <!-- ENVIOS -->
  <section id="tela-pendencias" class="tela" hidden>
    <header class="topo">
      <button class="btn-icone" data-voltar aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <strong>Envios</strong>
    </header>
    <main id="pendencias-root" class="form"></main>
  </section>

  <!-- AVISO DE NOVA RECEITA -->
  <div id="aviso-hidrometro" class="modal-rec" role="alertdialog" aria-live="assertive" hidden></div>
  <div id="aviso-lavagem" class="modal-rec" role="alertdialog" aria-live="assertive" hidden></div>
  <div id="aviso-receita" class="modal-rec" role="alertdialog" aria-live="assertive" hidden></div>
  <button id="sino-receitas" class="sino" type="button" aria-label="Receitas para aplicar" hidden></button>

  <script src="script.js"></script>
</body>
</html>
